services:
  cindertrail:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -Y off -qO- http://127.0.0.1/healthz | grep -qx ok && wget -Y off -q --spider http://127.0.0.1/showcase/game/runtime/index.files.js"]
      interval: 30s
      timeout: 5s
      retries: 3
