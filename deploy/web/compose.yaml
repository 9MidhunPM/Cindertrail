services:
  cindertrail:
    build:
      context: ../..
      dockerfile: deploy/web/Dockerfile
    restart: unless-stopped
    expose:
      - "80"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/ | grep -q 'CINDERTRAIL'" ]
      interval: 30s
      timeout: 5s
      retries: 3
