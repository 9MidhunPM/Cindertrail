server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css;
    gzip_static on;

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /play {
        return 308 /play/;
    }

    location = /game {
        return 308 /play/;
    }

    location = /game/ {
        return 308 /play/;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location /showcase/game/runtime/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }

    location ~ ^/assets/.*\.glb$ {
        default_type model/gltf-binary;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ =404;
    }
}
