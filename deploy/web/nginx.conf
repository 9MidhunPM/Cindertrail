server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_types application/javascript text/css;
    gzip_static on;

    location / {
        try_files $uri $uri/ =404;
    }

    location /game/runtime/ {
        add_header Cache-Control "public, max-age=3600";
        try_files $uri =404;
    }
}
